name: foundation
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check C++ formatting
        run: |
          python -m pip install clang-format==22.1.3
          python tools/format_cpp.py --check
      - name: Linux SDL build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake --preset windows-debug
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake --preset linux-debug
      - name: Build Windows
        if: runner.os == 'Windows'
        run: cmake --build --preset windows-debug --parallel 4
      - name: Build Linux
        if: runner.os == 'Linux'
        run: cmake --build --preset linux-debug --parallel 4
      - name: Test Windows
        if: runner.os == 'Windows'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: ctest --preset windows-debug
      - name: Test Linux
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: ctest --preset linux-debug
      - name: Linux client packaging smoke
        if: runner.os == 'Linux'
        run: python tools/package_linux_client.py --bin-dir out/build/linux-debug --sdl-license out/build/linux-debug/_deps/sdl3-src/LICENSE.txt --enet-license out/build/linux-debug/_deps/enet-src/LICENSE
      - name: Validate JSON schema and format
        shell: bash
        run: |
          python -m pip install jsonschema==4.23.0
          python tools/check_contracts.py
      - name: Offline core configure
        run: cmake -S . -B out/offline -DSTACKPULSE_BUILD_CLIENT=OFF -DSTACKPULSE_BUILD_TESTS=OFF -DSTACKPULSE_BUILD_NETWORK=OFF -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Offline core build
        run: cmake --build out/offline --config Release --parallel 4
